[project]
name = "loop-controller"
version = "0.26.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp<2.0",
    "pyjwt[crypto]>=2.8",
    "cryptography>=44.0",
]

[project.optional-dependencies]
server = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
]
grpc = [
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
]

[project.scripts]
lc = "loop_controller.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260815",
    "grpcio-tools>=1.68",
    "mypy-protobuf>=5.1.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
# Same as Black.
line-length = 100

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`, `W`), isort (`I`), pep8-naming (`N`), pyupgrade (`UP`)
# but exclude bandit (`BLE`) rules for early-stage development
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "ANN", "D", "BLE"]
exclude = ["src/loop_controller/v1/*"]
[tool.ruff.lint.per-file-ignores]
"src/loop_controller/grpc_server.py" = ["N802"]
"tests/test_grpc_server.py" = ["N802"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["src/loop_controller/v1/", "examples/contrib/adapters/"]

[[tool.mypy.overrides]]
module = ["langchain_core.*", "grpc.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["loop_controller.grpc_server", "loop_controller.grpc_client"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
norecursedirs = ["legacy", "data", "venv", "__pycache__"]
