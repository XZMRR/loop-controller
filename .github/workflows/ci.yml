name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Check whitespace errors
        run: git diff --check

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Mypy type check
        run: uv run mypy src

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --dev --extra server

      - name: Run unit tests
        run: uv run pytest tests/ -q -m "not integration"
        env:
          LOOP_CONTROLLER_AUDIT_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Build distributions
        run: uv build

      - name: Smoke test installed wheel
        run: |
          wheels=(dist/loop_controller-*.whl)
          test -f "${wheels[0]}"
          uv venv --python 3.12 .venv-release
          uv pip install --python .venv-release/bin/python "${wheels[0]}"
          (cd /tmp && "$GITHUB_WORKSPACE/.venv-release/bin/lc" --help)
          (cd /tmp && "$GITHUB_WORKSPACE/.venv-release/bin/python" -c "import loop_controller")

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --dev --extra server

      - name: Download and verify OPA
        env:
          OPA_VERSION: v1.19.0
          OPA_SHA256: 1dd5c5591ff856f5e20a1d66bafae9511ddf3c5552ed3b5070c70b2b6580ee3f
        run: |
          mkdir -p tools
          curl --fail --location --show-error --silent \
            -o tools/opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  tools/opa" | sha256sum --check --strict
          chmod +x tools/opa

      - name: Verify OPA is available
        run: |
          test -x tools/opa
          ./tools/opa version

      - name: Run integration tests
        run: uv run pytest tests/integration -q -m integration
        env:
          OPA_PATH: tools/opa
          LOOP_CONTROLLER_AUDIT_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  go:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run Go tests with race detector
        working-directory: go
        run: go test -race ./...
