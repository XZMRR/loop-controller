name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Mypy type check
        run: uv run mypy src

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install server extras
        run: uv pip install -e ".[server]"

      - name: Run unit tests
        run: uv run pytest tests/ -q -m "not integration"
        env:
          LOOP_CONTROLLER_AUDIT_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install server extras
        run: uv pip install -e ".[server]"

      - name: Download OPA
        run: |
          mkdir -p tools
          curl -L -o tools/opa https://openpolicyagent.org/downloads/v1.0.1/opa_linux_amd64_static
          chmod +x tools/opa

      - name: Verify OPA is available
        run: |
          test -x tools/opa
          ./tools/opa version

      - name: Run integration tests
        run: uv run pytest tests/integration -q -m integration
        env:
          OPA_PATH: tools/opa
          LOOP_CONTROLLER_AUDIT_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
