title: DelegationRequest
type: object
required:
  - protocol_version
  - request_id
  - initiator_agent_id
  - target_agent_id
  - tool_name
  - arguments
  - session_id
  - task_id
  - risk_level
  - allowed_tools
  - allowed_capabilities
  - allow_redelegation
properties:
  protocol_version:
    $ref: './protocol-version.yaml'
  request_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  tenant_id:
    type: string
  target_workload_id:
    type: string
  target_instance_id:
    type: string
  root_interaction_id:
    type: string
  parent_interaction_id:
    type: string
  root_task_id:
    type: string
  delegation_depth:
    type: integer
    minimum: 0
  initiator_agent_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  target_agent_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  tool_name:
    type: string
  arguments:
    type: object
    additionalProperties: true
    description: Tool arguments as a JSON object; must not be double-encoded.
  session_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  task_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  risk_level:
    type: string
    enum:
      - low
      - medium
      - high
      - critical
  allowed_tools:
    type: array
    items:
      type: string
    description: Caller-requested tool scope; each delegation narrows it by intersection.
  allowed_capabilities:
    type: array
    items:
      type: string
    description: Caller-requested capability scope; each delegation narrows it by intersection.
  allow_redelegation:
    type: boolean
    default: false
  parent_task_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
    description: Persisted parent task used by the kernel to derive trusted lineage.
  budget:
    type: object
    properties:
      token_count:
        type: integer
        minimum: 0
      payment_amount:
        type: number
        minimum: 0
      currency:
        type: string
  deadline:
    type: string
    format: date-time
description: Request to delegate a tool execution to a target agent.
