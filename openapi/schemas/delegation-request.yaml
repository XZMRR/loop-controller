title: DelegationRequest
type: object
required:
  - protocol_version
  - request_id
  - initiator_agent_id
  - target_agent_id
  - tool_name
  - arguments
  - session_id
  - task_id
  - risk_level
properties:
  protocol_version:
    $ref: './protocol-version.yaml'
  request_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  initiator_agent_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  target_agent_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  tool_name:
    type: string
  arguments:
    type: object
    additionalProperties: true
    description: Tool arguments as a JSON object; must not be double-encoded.
  session_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  task_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  risk_level:
    type: string
    enum:
      - low
      - medium
      - high
      - critical
description: Request to delegate a tool execution to a target agent.
