title: CreateTaskRequest
type: object
required:
  - protocol_version
  - session_id
  - initiator_agent_id
  - target_agent_id
properties:
  protocol_version:
    $ref: './protocol-version.yaml'
  session_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  initiator_agent_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  target_agent_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
description: Caller-supplied scope used to create a Task.
