title: Task
type: object
required:
  - protocol_version
  - task_id
  - session_id
  - initiator_agent_id
  - target_agent_id
  - status
  - created_at
  - updated_at
properties:
  protocol_version:
    $ref: './protocol-version.yaml'
  task_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  session_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  initiator_agent_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  target_agent_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  status:
    type: string
    enum:
      - pending
      - accepted
      - running
      - completed
      - failed
      - cancelled
      - outcome_unknown
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  completed_at:
    type: string
    format: date-time
  outcome:
    description: Successful result or failure summary as a JSON value; may be absent.
  error_code:
    type: string
  root_task_id:
    type: string
  parent_task_id:
    type: string
  delegation_depth:
    type: integer
    minimum: 0
  root_interaction_id:
    type: string
  parent_interaction_id:
    type: string
  deadline:
    type: string
    format: date-time
  allowed_tools:
    type: array
    items:
      type: string
  allowed_capabilities:
    type: array
    items:
      type: string
  allow_redelegation:
    type: boolean
  budget:
    description: Maximum budget envelope assigned to this task; it is not actual consumption.
    type: object
    required: [token_count, payment_amount]
    properties:
      token_count: {type: integer, minimum: 0}
      payment_amount: {type: number, minimum: 0}
      currency: {type: string}
  reserved_budget:
    description: Portion of this task's envelope currently reserved by non-settled child tasks.
    type: object
    required: [token_count, payment_amount]
    properties:
      token_count: {type: integer, minimum: 0}
      payment_amount: {type: number, minimum: 0}
      currency: {type: string}
  consumed_budget:
    description: Actual measured consumption settled from child tasks; never the assigned envelope or an estimate.
    type: object
    required: [token_count, payment_amount]
    properties:
      token_count: {type: integer, minimum: 0}
      payment_amount: {type: number, minimum: 0}
      currency: {type: string}
description: Represents a delegated task and its current lifecycle state.
