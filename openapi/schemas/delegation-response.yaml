title: DelegationResponse
type: object
required:
  - protocol_version
  - allowed
  - reason
properties:
  protocol_version:
    $ref: './protocol-version.yaml'
  allowed:
    type: boolean
  decision_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  task_id:
    type: string
    pattern: '^[a-zA-Z0-9_.-]{1,128}$'
  target_entrypoint:
    type: object
    required:
      - type
      - url
    properties:
      type:
        type: string
        enum:
          - http
      url:
        type: string
        format: uri
  delegation_token:
    type: string
  reason:
    type: string
description: Result of a delegation authorization request.
