# Loop Controller 身份 Provider 配置（v0.20.0）
#
# provider 可选：static（开发/测试）、jwt（生产）、mtls（生产）
identity:
  provider: static
  static:
    allowed_tokens:
      - token: dev-token-researcher-001
        agent_id: researcher_001
        user_id: alice
      # Go 内核 executor 以目标 agent 身份调用 /v1/govern/tool-call，
      # user_id 携带委托发起方；开发环境为外部 agent 研究线配置专用 token。
      - token: dev-token-research-agent-001
        agent_id: research-agent
        user_id: researcher_001
      # specialist-agent 的工作负载凭证：research-agent 重委托后由内核
      # 以目标 agent 身份回调 /v1/govern/tool-call 时使用。
      - token: dev-token-specialist-agent-001
        agent_id: specialist-agent
        user_id: research-agent

  # 生产环境示例：JWT
  # jwt:
  #   issuer: https://auth.company.com
  #   audience: loop-controller
  #   jwks_url: https://auth.company.com/.well-known/jwks.json
  #   claim_mappings:
  #     agent_id: agent_id
  #     user_id: user_id
  #     harness_id: harness_id

  # 生产环境示例：mTLS
  # mtls:
  #   cert_subject_template: "agent-researcher-prod-{harness_id}"
  #   cert_mappings:
  #     - subject: "CN=agent-researcher-prod-001,O=company"
  #       agent_id: researcher_001
  #       harness_id: prod-001
