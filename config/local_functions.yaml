# 本地函数工具注册（v0.23.0）
# analyze_sales 为 A2A 委托闭环 E2E 使用的模拟分析函数。
tools:
  analyze_sales:
    module: tests.integration.local_tools
    function: analyze_sales
    description: 模拟销售数据分析（E2E 委托闭环）
    input_schema:
      type: object
      properties:
        region: {type: string}
        period: {type: string}
      required: [region, period]
      additionalProperties: true
    cost_per_call: 0
    default_risk: low
    sandbox:
      timeout_seconds: 10
      max_output_bytes: 65536
      allowed_paths: []
      env_whitelist: []
  # trusted_local_tools 白名单要求注册（execution_policy.yaml）
  calculate_checksum:
    module: tests.integration.local_tools
    function: calculate_checksum
    description: 模拟文件校验和（trusted_local 占位）
    input_schema:
      type: object
      properties:
        path: {type: string}
      required: [path]
      additionalProperties: true
    cost_per_call: 0
    default_risk: low
    sandbox:
      timeout_seconds: 10
      max_output_bytes: 65536
      allowed_paths: []
      env_whitelist: []
  transform_data:
    module: tests.integration.local_tools
    function: transform_data
    description: 模拟数据转换（trusted_local 占位）
    input_schema:
      type: object
      properties:
        data: {type: array}
      required: [data]
      additionalProperties: true
    cost_per_call: 0
    default_risk: low
    sandbox:
      timeout_seconds: 10
      max_output_bytes: 65536
      allowed_paths: []
      env_whitelist: []
