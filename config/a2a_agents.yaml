# A2A Agent Card 静态发现样例（v0.48.0）
# 本文件为 Go A2A 内核的静态发现 Provider 提供示例 Agent Card。
# 生产部署时应替换为真实 Agent 的 endpoint、capabilities 与 token。

- agent_id: loop-controller-local
  name: Loop Controller Python Runtime
  entrypoint:
    type: http
    url: http://127.0.0.1:8000
  capabilities:
    - delegate_execution
  version: 0.48.0

- agent_id: research-agent
  name: Research Agent
  execution_mode: remote_results
  entrypoint:
    type: http
    url: http://127.0.0.1:8001
  capabilities:
    - delegate_execution
    - stream_task
  version: 0.48.0

# 下游专业 Agent：承接 research-agent 的重委托（entrypoint stub :8002 演示实例）。
- agent_id: specialist-agent
  name: Specialist Agent
  execution_mode: remote_results
  entrypoint:
    type: http
    url: http://127.0.0.1:8002
  capabilities:
    - delegate_execution
    - stream_task
  version: 0.48.0
