# Loop Controller 身份配置（§4.2）
# agent_id 预先分配，运行期不可变；Profile 一对一静态绑定。
agents:
  - agent_id: researcher_001
    name: Research Assistant
    profile_id: research_assistant_v1
    owner_id: zhang_manager
    identity:
      issuer: https://auth.company.com
      subject: agent://research-assistant/prod-001
      # mTLS 场景下证书 CN/SAN 匹配模板（可选）
      # cert_subject_template: "agent-researcher-prod-{harness_id}"
  # 外部 A2A Agent（Go 内核注册），工具经内核 executor 回调 /v1/govern/tool-call 执行。
  - agent_id: research-agent
    name: External Research Agent
    profile_id: research_assistant_v1
    owner_id: zhang_manager
  # 下游专业 Agent：承接 research-agent 的重委托（如 calculate_checksum）。
  - agent_id: specialist-agent
    name: Specialist Agent
    profile_id: research_assistant_v1
    owner_id: zhang_manager

users:
  - user_id: alice
    display_name: Alice
  - user_id: zhang_manager
    display_name: 张经理
