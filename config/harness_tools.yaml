# Harness 后端与工具配置（v0.25.0）
# Loop Controller 通过 Harness 将高危工具调用转发给独立执行进程/容器，
# 保持治理平面自身不直接执行 Shell/SQL/Browser 等副作用。
#
# 本文件默认全部注释，避免在测试/启动时自动拉起子进程 Harness。
# 启用前请取消注释对应后端与工具，并将工具名加入 profiles.yaml 中对应 Profile。

