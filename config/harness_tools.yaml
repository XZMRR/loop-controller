# Harness 后端与工具配置（v0.27.0）
# Loop Controller 只负责治理并将调用转发给独立 Harness Service；文件系统、网络、
# 进程和资源隔离必须由 Harness 及其容器/Kubernetes/VM/专用主机部署环境提供。
#
# 本文件默认全部注释，避免无 Harness 环境启动失败。生产主路径是 HTTPS 远程
# HTTP Harness；subprocess 仅用于开发/集成测试。Loop Controller 不直接编排 Docker。
# 启用前还需将工具名加入 profiles.yaml，并通过环境变量注入认证密钥。

