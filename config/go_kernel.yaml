# v0.54 Go 交互治理内核客户端配置样例。
# 凭据在进程启动时读取为静态快照；SSE 重连复用同一安全客户端。
go_kernel:
  enabled: false
  base_url: "https://127.0.0.1:8080"
  timeout: 5.0
  # 仅显式 development: true 才允许 HTTP 或缺少 mTLS/control token。
  development: false
  dispatch_entrypoints: true
  # Control Bearer 与 Go 内核签发 delegation token 的 HMAC secret 必须分离。
  control_token_env: "LC_A2A_CONTROL_TOKEN"
  approver_token_env: "LC_A2A_APPROVAL_TOKEN"
  token_secret_env: "GO_KERNEL_TOKEN_SECRET"
  mtls:
    ca_file: "config/tls/ca.pem"
    client_cert_file: "config/tls/client.pem"
    client_key_file: "config/tls/client-key.pem"
  discovery:
    static_file: "config/a2a_agents.yaml"
  local_agent:
    agent_id: "loop-controller-local"
    name: "Loop Controller Python Runtime"
    entrypoint: "http://127.0.0.1:8000"
    capabilities:
      - "delegate_execution"
    version: "0.54.0"
