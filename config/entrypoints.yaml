# Loop Controller 入口认证与管理授权配置（当前 v0.54.0；strict 安全字段于 v0.53.0 引入）
#
# auth 可选：jwt / mtls / static_token / none
# require_auth 为 false 时仅开发/测试使用
entrypoints:
  http:
    auth: jwt
    require_auth: true
  mcp_proxy_stdio:
    auth: static_token
    require_auth: false  # 开发/测试可关闭；生产建议 true
  mcp_proxy_sse:
    auth: mtls
    require_auth: true

approval_auth:
  allowlist:
    - zhang_manager
  credentials:
    - principal: zhang_manager
      token_env: LOOP_CONTROLLER_APPROVER_ZHANG_MANAGER_TOKEN
