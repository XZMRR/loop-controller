# Loop Controller 入口认证配置（v0.20.0）
#
# auth 可选：jwt / mtls / static_token / none
# require_auth 为 false 时仅开发/测试使用
entrypoints:
  http:
    auth: jwt
    require_auth: true
  grpc:
    auth: mtls
    require_auth: true
  mcp_proxy_stdio:
    auth: static_token
    require_auth: false  # 开发/测试可关闭；生产建议 true
  mcp_proxy_sse:
    auth: mtls
    require_auth: true
