# R0 审批路由、事实源与可靠 webhook 配置（当前 v0.54.0；可靠 webhook 于 v0.49.0 引入）
# approvers/rules 只确定 escalation_target；approve/deny 身份由 entrypoints.yaml 的 approval_auth 认证。
approvers:
  default: zhang_manager
store_path: ./data/approvals.db
webhook:
  enabled: false
  url: ""
  auth_header_name: Authorization
  auth_header_value: ""
  timeout_seconds: 10
  poll_interval_seconds: 1
  lease_seconds: 30
  batch_size: 20
  retry_base_seconds: 1
  retry_max_seconds: 300
rules:
  - tool_name: send_email
    approver: zhang_manager
